# ziyara.vip, stage 1 (no certificate yet): serves the docs over HTTP and answers the ACME challenge.
# Only matches Host ziyara.vip / www.ziyara.vip; every other site on this server is untouched.
server {
    listen 80;
    listen [::]:80;
    server_name ziyara.vip www.ziyara.vip;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    root /var/www/ziyara-vip/current;
    index index.html;
    charset utf-8;
    access_log /var/log/nginx/ziyara-vip.access.log;
    error_log  /var/log/nginx/ziyara-vip.error.log;

    location / { try_files $uri $uri/index.html =404; }
    error_page 404 /404.html;
}
