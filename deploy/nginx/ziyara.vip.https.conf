# ziyara.vip, stage 2 (certificate issued): HTTPS static site, canonical host ziyara.vip, SEO-friendly caching.
# Prerendered by Nuxt (nuxt generate): every URL is a real HTML file, so crawlers get full content.

server {                                   # http -> https, keep the ACME path for renewals
    listen 80;
    listen [::]:80;
    server_name ziyara.vip www.ziyara.vip;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://ziyara.vip$request_uri; }
}

server {                                   # www -> apex (one canonical host)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ziyara.vip;
    ssl_certificate     /etc/letsencrypt/live/ziyara.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziyara.vip/privkey.pem;
    return 301 https://ziyara.vip$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ziyara.vip;

    ssl_certificate     /etc/letsencrypt/live/ziyara.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziyara.vip/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/ziyara-vip/current;
    index index.html;
    charset utf-8;
    access_log /var/log/nginx/ziyara-vip.access.log;
    error_log  /var/log/nginx/ziyara-vip.error.log;

    # Security headers. Enable HSTS only after you have confirmed that https works everywhere:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml font/otf font/ttf;

    # one URL per page: no trailing slash (matches the canonical tags and the sitemap)
    rewrite ^/(.+)/$ /$1 permanent;

    # hashed build assets: cache for a year
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ~* \.(png|jpe?g|webp|svg|ico|otf|ttf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # crawler and AI files: always fresh enough, correct types
    location = /sitemap.xml  { default_type application/xml;  add_header Cache-Control "public, max-age=3600" always; try_files $uri =404; }
    location = /robots.txt   { default_type text/plain;       add_header Cache-Control "public, max-age=3600" always; try_files $uri =404; }
    location = /llms.txt     { default_type text/plain;       add_header Cache-Control "public, max-age=3600" always; try_files $uri =404; }
    location = /llms-full.txt{ default_type text/plain;       add_header Cache-Control "public, max-age=3600" always; try_files $uri =404; }
    location = /manifest.json{ default_type application/json; add_header Cache-Control "public, max-age=3600" always; try_files $uri =404; }
    location = /version.json { default_type application/json; add_header Cache-Control "no-store" always; try_files $uri =404; }

    # html: always revalidate so a new release is visible immediately
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /404.html;
}
