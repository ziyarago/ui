name: A11y
# Builds the docs site (optionally with the Pro demos), serves it and runs the axe audit with every popup opened. Run by hand:
#   gh workflow run A11y --ref <branch> -f ref=<branch> -f pro=true -f pro_ref=<branch>
on:
  workflow_dispatch:
    inputs:
      pro: { description: 'build with Pro demos', type: boolean, default: true }
      ref: { description: 'branch or commit of this repo', default: 'main' }
      pro_ref: { description: 'branch or commit of ui-pro', default: 'main' }

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.ref }}', path: ZiyaraGo_UI }
      - name: Check out the Pro package
        if: inputs.pro
        uses: actions/checkout@v4
        with:
          repository: ziyarago/ui-pro
          ref: ${{ inputs.pro_ref }}
          ssh-key: ${{ secrets.PRO_DEPLOY_KEY }}
          path: ZiyaraGo_UI_pro
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the library
        working-directory: ZiyaraGo_UI
        run: npm ci && npm run build
      - name: Build the Pro package
        if: inputs.pro
        working-directory: ZiyaraGo_UI_pro
        run: npm ci && npm run build
      - name: Build the docs site
        working-directory: ZiyaraGo_UI/site
        env:
          ZIYARAGO_PRO: ${{ inputs.pro && '1' || '' }}
        run: npm ci && npm run generate
      - name: Serve and audit
        working-directory: ZiyaraGo_UI
        run: |
          (cd site/.output/public && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 3
          node scripts/a11y.mjs http://localhost:8080 --open --json=a11y.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: a11y, path: ZiyaraGo_UI/a11y.json, retention-days: 3 }
