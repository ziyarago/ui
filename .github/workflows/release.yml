name: Release
# Every push to main is released: semantic-release picks the version from the commit messages
# (feat -> minor, fix/docs/chore/refactor/... -> patch, "!" or BREAKING CHANGE -> major),
# updates package.json and CHANGELOG.md, tags, publishes @ziyarago/ui and @ziyarago/ui-mcp to npm,
# creates a GitHub release and deploys the docs site to ziyara.vip (see deploy-docs.yml).
on:
  push:
    branches: [main, next]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      released: ${{ steps.ver.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      - run: cd packages/mcp && npm ci
      - run: npm run build && npm run check
      - id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check publish secrets
        id: guard
        run: |
          if [ -z "$NPM_TOKEN" ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::warning::NPM_TOKEN is not set: release skipped (add the secret, then push or re-run)"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: semantic-release
        if: steps.guard.outputs.ok == 'true'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_AUTHOR_NAME: ziyarago-release-bot
          GIT_AUTHOR_EMAIL: dev@ziyarago.com
          GIT_COMMITTER_NAME: ziyarago-release-bot
          GIT_COMMITTER_EMAIL: dev@ziyarago.com
      - id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # a release happened only if semantic-release created its release commit in this run (HEAD moved)
          if [ "$(git rev-parse HEAD)" != "${{ steps.before.outputs.sha }}" ]; then
            git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "+refs/tags/*:refs/tags/*"
            tag=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -n1 || true)
          fi
          if [ -n "${tag:-}" ]; then echo "released=true" >> "$GITHUB_OUTPUT"; echo "version=${tag#v}" >> "$GITHUB_OUTPUT"; else echo "released=false" >> "$GITHUB_OUTPUT"; fi

  deploy-docs:
    needs: release
    if: needs.release.outputs.released == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-docs.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
