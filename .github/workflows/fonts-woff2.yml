name: Fonts woff2
# One-off: container change .otf -> .woff2 for the Thmanyah faces, no subsetting and no glyph or table edits
# (the Thmanyah license forbids modifying the font program). Commits nothing; uploads the files as an artifact.
on:
  workflow_dispatch:
  push:
    branches: [fix-fonts]
    paths: [.github/workflows/fonts-woff2.yml]

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fonttools and brotli
        run: pip install fonttools brotli
      - name: Convert
        run: |
          mkdir -p out
          python - <<'PY'
          import glob, os
          from fontTools.ttLib import TTFont
          for p in sorted(glob.glob('assets/fonts/thmanyah/*.otf')):
              f = TTFont(p)
              f.flavor = 'woff2'
              o = 'out/' + os.path.basename(p)[:-4] + '.woff2'
              f.save(o)
              print(os.path.basename(p), os.path.getsize(p), '->', os.path.getsize(o))
          PY
          du -cb assets/fonts/thmanyah/*.otf | tail -1
          du -cb out/*.woff2 | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: thmanyah-woff2
          path: out/*.woff2
