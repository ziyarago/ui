name: audit-behaviour
# Emulates real use of every free component in headless Chrome (Vue + React): themes, palettes, rtl, 360/1440 widths, stress data,
# with automatic oracles (overflow, clipping, squeeze, contrast, focus ring, target size, ids, tab order, axe, console, layout shift)
# and scripted flows. Findings not listed in tests/behaviour/baseline.json fail the job.
on:
  workflow_dispatch:
    inputs:
      report_only: { description: 'do not fail on new findings', type: boolean, default: false }
  pull_request:
    branches: [main]
  push:
    branches: [audit-behaviour]

concurrency:
  group: audit-behaviour-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenario: [base, palette, rtl, narrow, size, overlay, long, intl, big, empty, nulls]
    env:
      CHROME_PATH: /usr/bin/google-chrome
      BROWSER_CONCURRENCY: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Audit
        run: node tests/behaviour/audit.mjs --scenarios=${{ matrix.scenario }} --out=audit-out ${{ inputs.report_only && '--report-only' || '' }}
      - name: Summary
        if: always()
        run: |
          echo "### ${{ matrix.scenario }}" >> "$GITHUB_STEP_SUMMARY"
          cat audit-out/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: audit-${{ matrix.scenario }}, path: audit-out, retention-days: 7 }

  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Flows
        run: node tests/behaviour/flows.mjs --out=flows-out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: flows, path: flows-out, retention-days: 7 }
