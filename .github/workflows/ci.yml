name: CI
on:
  pull_request:
  push:
    branches-ignore: [main, next]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Pack dry run
        run: npm pack --dry-run
      - name: MCP server starts
        working-directory: packages/mcp
        run: npm ci && node bin/cli.mjs help
      - name: Docs site builds
        working-directory: site
        run: npm ci && npm run generate

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Unit, SSR and real-browser tests (Vue + React)
        run: npm test
